services:
  - type: web
    name: glitrai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glitrai-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: IMAGE_BACKEND
        value: pollinations
      - key: COMFYUI_BASE_URL
        sync: false

databases:
  - name: glitrai-db
    plan: free
